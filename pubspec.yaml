name: marieum_app
description: "Marieum mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audio_session: ^0.2.4
  bloc_concurrency: ^0.3.0
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_tts: ^4.2.5
  get_it: ^9.3.0
  go_router: ^18.1.2
  intl: ^0.20.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/fonts/OFL.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
